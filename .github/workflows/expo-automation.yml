name: Expo Automated CI/CD

on:
  push:
    branches:
      - main
      - version4
  workflow_dispatch:
    inputs:
      action_type:
        description: 'Choose action to run manually'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - ota_update
          - build_apk

jobs:
  analyze_and_run:
    runs-on: ubuntu-latest
    name: Detect Changes & Run Expo Commands

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🔍 Inspect changed files
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            native:
              - 'android/**'
              - 'ios/**'
              - 'package.json'
              - 'package-lock.json'
              - 'app.json'
              - 'eas.json'
            ota:
              - 'app/**'
              - 'components/**'
              - 'constants/**'
              - 'context/**'
              - 'hooks/**'
              - 'utils/**'
              - 'types/**'
              - 'assets/**'

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🚀 Setup EAS CLI & Expo Token
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # -------------------------------------------------------------
      # Condition A: Native Changes Detected or [build] in Commit
      # Runs EAS Build to generate a fresh APK
      # -------------------------------------------------------------
      - name: 📱 Run EAS Build (New APK)
        if: |
          github.event.inputs.action_type == 'build_apk' ||
          (github.event.inputs.action_type != 'ota_update' && (
            steps.filter.outputs.native == 'true' ||
            contains(github.event.head_commit.message, '[build]') ||
            contains(github.event.head_commit.message, '[apk]')
          ))
        run: |
          echo "Native dependencies or config changed! Building new APK..."
          npx eas-cli build --platform android --profile preview --non-interactive

      # -------------------------------------------------------------
      # Condition B: Only JS/TS/Asset Changes Detected
      # Runs EAS Update (OTA) without compiling a new APK
      # -------------------------------------------------------------
      - name: ⚡ Run EAS OTA Update
        if: |
          github.event.inputs.action_type == 'ota_update' ||
          (github.event.inputs.action_type != 'build_apk' &&
           steps.filter.outputs.native != 'true' &&
           (steps.filter.outputs.ota == 'true' || github.event_name == 'workflow_dispatch') &&
           !contains(github.event.head_commit.message, '[build]') &&
           !contains(github.event.head_commit.message, '[apk]'))
        run: |
          echo "Only JS/UI changes detected! Publishing OTA update..."
          BRANCH_NAME="production"
          if [ "${{ github.ref_name }}" != "main" ]; then
            BRANCH_NAME="preview"
          fi
          npx eas-cli update --branch $BRANCH_NAME --message "${{ github.event.head_commit.message || 'Automated OTA update from Git Push' }}" --non-interactive
